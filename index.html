<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- 
    font-family: "Amatic SC", sans-serif;
    font-family: "Schoolbell", cursive;
    font-family: "Inter", sans-serif;
    -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Schoolbell&display=swap');
      @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css');

      * {
        margin: 0;
        padding: 0;

        &::selection {
          color: #ede8e4;
          background-color: #000000;
        }
      }

      html,
      body {
        background-color: #ede8e4;
        overflow: hidden;
      }

      #three {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      #shader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1001;
        pointer-events: none;
      }

      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ede8e4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1002;
        transition: opacity 0.5s ease-out;
        gap: 24px;
      }

      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-title {
        font-family: 'Schoolbell', sans-serif;
        font-size: 3rem;
        font-weight: 700;
        color: #000;
        text-align: center;
        position: relative;
        display: inline-block;
        margin-bottom: 0;
      }

      .loader-title .fa-square {
        position: absolute;
        top: -0.4em;
        left: -0.8em;
        font-size: 0.55em;
        background: linear-gradient(
          135deg,
          #fde61b 0%,
          #f69e02 30%,
          #fa5a03 60%,
          #bf0505 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transform: rotate(-25deg);
        animation: leafFloat 3s ease-in-out infinite;
      }

      @keyframes leafFloat {
        0%,
        100% {
          transform: rotate(-25deg) translateY(0px);
        }
        50% {
          transform: rotate(-20deg) translateY(-3px);
        }
      }

      .loader-progress {
        width: 350px;
        height: 2px;
        background-color: rgba(0, 0, 0, 0.15);
        overflow: hidden;
        margin: 0;
        border-radius: 1px;
      }

      .loader-progress-bar {
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        width: 0%;
        transition: width 0.3s ease-out;
        border-radius: 1px;
      }

      .loader-text {
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        color: rgba(0, 0, 0, 0.5);
        text-align: center;
        line-height: 1.5;
        max-width: 400px;
        margin: 0;
        min-height: 40px;
      }

      .explore-buttons {
        display: flex;
        gap: 16px;
        opacity: 0;
        transform: translateY(15px);
        transition: all 0.25s ease;
        visibility: hidden;
      }

      .explore-button {
        padding: 14px 24px;
        border-radius: 0;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s ease;
        margin: 0;
        border: 1.5px solid;
      }

      .explore-button-light {
        background: transparent;
        border-color: rgba(0, 0, 0, 0.6);
        color: rgba(0, 0, 0, 0.8);
      }

      .explore-button-light:hover {
        background: rgba(0, 0, 0, 0.04);
        border-color: rgba(0, 0, 0, 0.9);
        color: rgba(0, 0, 0, 1);
        transform: translateY(-1px);
      }

      .explore-button-light:active {
        transform: translateY(0px);
        background: rgba(0, 0, 0, 0.08);
      }

      .explore-button-dark {
        background: rgba(0, 0, 0, 0.9);
        border-color: rgba(0, 0, 0, 0.9);
        color: rgba(255, 255, 255, 0.95);
      }

      .explore-button-dark:hover {
        background: rgba(0, 0, 0, 1);
        border-color: rgba(0, 0, 0, 1);
        color: rgba(255, 255, 255, 1);
        transform: translateY(-1px);
      }

      .explore-button-dark:active {
        transform: translateY(0px);
        background: rgba(0, 0, 0, 0.8);
      }

      .explore-buttons.show {
        opacity: 1;
        transform: translateY(0px);
        visibility: visible;
      }

      .explore-button i {
        transition: transform 0.3s ease;
        font-size: 0.75rem;
      }

      /* Right Side Control Panel */
      #control-panel {
        position: fixed;
        right: 24px;
        bottom: 24px;
        display: none;
        flex-direction: column;
        gap: 16px;
        z-index: 1000;
      }

      #control-panel.show {
        display: flex;
        animation: controlPanelFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }

      /* Music Control Button */
      #music-control {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #ede8e4;
        border: 1.5px solid rgba(0, 0, 0, 0.1);
        color: #000;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        font-family: 'Inter', sans-serif;
      }

      #music-control:hover {
        transform: translateY(-2px) scale(1.05);
        background: #f5f0ec;
        border-color: rgba(0, 0, 0, 0.2);
        color: #000;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2),
          0 4px 12px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      #music-control:active {
        transform: translateY(-1px) scale(1.02);
        background: #ede8e4;
      }

      #music-control.muted {
        background: #d0c8c0;
        color: rgba(0, 0, 0, 0.5);
        border-color: rgba(0, 0, 0, 0.08);
      }

      #music-control.muted:hover {
        background: #c8bfb7;
        color: rgba(0, 0, 0, 0.7);
        border-color: rgba(0, 0, 0, 0.15);
      }

      /* Day/Night Toggle */
      #daynight-toggle {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #ede8e4;
        backdrop-filter: blur(16px);
        border-radius: 32px;
        padding: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08),
          0 2px 12px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        border: 0.5px solid rgba(0, 0, 0, 0.04);
        width: fit-content;
      }

      .daynight-button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        color: rgba(0, 0, 0, 0.6);
        background: transparent;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative;
        overflow: hidden;
      }

      .daynight-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 50%;
        background: transparent;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        z-index: -1;
        opacity: 0;
      }

      .daynight-button:hover {
        transform: scale(1.08) translateY(-1px);
        color: rgba(0, 0, 0, 0.8);
      }

      .daynight-button:hover::before {
        background: rgba(0, 0, 0, 0.08);
        opacity: 1;
      }

      .daynight-button:active {
        transform: scale(1.04);
      }

      .daynight-button.active {
        color: white;
        transform: scale(1.1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .daynight-button.active::before {
        opacity: 1;
      }

      /* Day/Night specific gradients */
      .daynight-button.active.day::before {
        background: linear-gradient(
          135deg,
          #ffe658 0%,
          #fdcb44 30%,
          #fdc13c 70%,
          #ffb300 100%
        );
      }

      .daynight-button.active.night::before {
        background: linear-gradient(
          135deg,
          #5c6bc0 0%,
          #3f51b5 30%,
          #303f9f 70%,
          #1a237e 100%
        );
      }

      /* Season Toggle Menu */
      #season-menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #ede8e4;
        backdrop-filter: blur(16px);
        border-radius: 32px;
        padding: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08),
          0 2px 12px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        border: 0.5px solid rgba(0, 0, 0, 0.04);
        width: fit-content;
      }

      .season-button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        color: rgba(0, 0, 0, 0.6);
        background: transparent;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative;
        overflow: hidden;
      }

      .season-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 50%;
        background: transparent;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        z-index: -1;
        opacity: 0;
      }

      .season-button:hover {
        transform: scale(1.08) translateY(-1px);
        color: rgba(0, 0, 0, 0.8);
      }

      .season-button:hover::before {
        background: rgba(0, 0, 0, 0.08);
        opacity: 1;
      }

      .season-button:active {
        transform: scale(1.04);
      }

      .season-button.active {
        color: white;
        transform: scale(1.1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .season-button.active::before {
        opacity: 1;
      }

      /* Refined Season-specific gradients */
      .season-button.active.spring::before {
        background: linear-gradient(
          135deg,
          #4caf50 0%,
          #388e3c 30%,
          #2e7d32 70%,
          #1b5e20 100%
        );
      }

      .season-button.active.autumn::before {
        background: linear-gradient(
          135deg,
          #ff8f00 0%,
          #f57c00 30%,
          #ef6c00 70%,
          #e65100 100%
        );
      }

      .season-button.active.winter::before {
        background: linear-gradient(
          135deg,
          #42a5f5 0%,
          #1e88e5 30%,
          #1976d2 70%,
          #0d47a1 100%
        );
      }

      .season-button.active.rain::before {
        background: linear-gradient(
          135deg,
          #78909c 0%,
          #546e7a 30%,
          #37474f 70%,
          #263238 100%
        );
      }

      @keyframes controlPanelFadeIn {
        0% {
          opacity: 0;
          transform: translateY(30px) translateX(30px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) translateX(0) scale(1);
        }
      }

      /* Page Title */
      #page-title {
        position: fixed;
        left: 28px;
        bottom: 24px;
        display: none;
        flex-direction: column;
        gap: 16px;
        z-index: 1000;
        font-family: 'Schoolbell', sans-serif;
        font-size: 3rem;
        font-weight: 700;
        color: #ede8e4;
        text-align: left;
        position: relative;
        text-shadow: 4px 4px 4px #00000045;
      }

      #page-title.show {
        display: flex;
        animation: pageTitleFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }

      #page-title .fa-square {
        position: absolute;
        top: -0.4em;
        left: -0.8em;
        font-size: 0.55em;
        background: linear-gradient(
          135deg,
          #fde61b 0%,
          #f69e02 30%,
          #fa5a03 60%,
          #bf0505 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transform: rotate(-25deg);
        animation: leafFloat 3s ease-in-out infinite;
      }

      @keyframes pageTitleFadeIn {
        0% {
          opacity: 0;
          transform: translateY(30px) translateX(-30px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) translateX(0) scale(1);
        }
      }

      #page-title {
        position: fixed;
        left: 24px;
        bottom: 24px;
        gap: 16px;
        z-index: 1000;
      }
    </style>
    <title>Elemental Serenity</title>
  </head>

  <body>
    <div id="app"></div>
    <canvas id="three"></canvas>

    <!-- Shader Reveal Overlay -->
    <canvas id="shader-overlay"></canvas>

    <!-- Right Side Control Panel -->
    <div id="control-panel">
      <!-- Day/Night Toggle -->
      <div id="daynight-toggle">
        <button class="daynight-button active day" data-time="day" title="Day">
          <i class="fas fa-sun"></i>
        </button>
        <button class="daynight-button night" data-time="night" title="Night">
          <i class="fas fa-moon"></i>
        </button>
      </div>

      <!-- Season Toggle Menu -->
      <div id="season-menu">
        <button
          class="season-button active spring"
          data-season="spring"
          title="Spring"
        >
          <i class="fas fa-seedling"></i>
        </button>
        <button
          class="season-button autumn"
          data-season="autumn"
          title="Autumn"
        >
          <i class="fas fa-leaf"></i>
        </button>
        <button
          class="season-button winter"
          data-season="winter"
          title="Winter"
        >
          <i class="fas fa-snowflake"></i>
        </button>
        <button class="season-button rain" data-season="rain" title="Rain">
          <i class="fas fa-cloud-rain"></i>
        </button>
      </div>

      <!-- Music Control Button -->
      <button id="music-control" title="Toggle Music">
        <i class="fas fa-music"></i>
      </button>
    </div>

    <div id="page-title">
      <i class="fa-regular fa-square"></i>Elemental Serenity
    </div>

    <!-- Loader Screen -->
    <div id="loader">
      <div class="loader-title">
        <i class="fa-regular fa-square"></i>Elemental Serenity
      </div>
      <div class="loader-progress">
        <div class="loader-progress-bar" id="progress-bar"></div>
      </div>
      <div class="loader-text" id="loader-text">Loading assets...</div>
      <div class="explore-buttons" id="explore-buttons">
        <button
          class="explore-button explore-button-light"
          id="explore-with-music"
        >
          <i class="fas fa-music"></i>
          <span>Explore with Music</span>
        </button>
        <button
          class="explore-button explore-button-dark"
          id="explore-without-music"
        >
          <i class="fas fa-volume-mute"></i>
          <span>Explore in Silence</span>
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
